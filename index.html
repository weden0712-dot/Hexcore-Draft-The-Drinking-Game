<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050510" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>喝酒之弈 | HEXCORE</title>
    <link rel="icon" href="./assets/card-back.svg" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="ar-background">
      <div class="grid-floor"></div>
      <div class="scan-line"></div>
      <div class="particles" id="particles"></div>
    </div>

    <main class="app-shell">
      <!-- 首页 -->
      <section class="panel home-panel" id="homePanel">
        <div class="holo-logo">
          <h1>HEXCORE</h1>
          <p class="subtitle">喝酒之弈 · 赛博酒局</p>
        </div>

        <div class="menu-card glass">
          <div class="menu-actions" id="menuChoices">
            <button class="holo-btn primary" id="menuCreateBtn">
              <span class="btn-icon">＋</span>
              <span>创建房间</span>
            </button>
            <button class="holo-btn secondary" id="menuJoinBtn">
              <span class="btn-icon">↪</span>
              <span>加入房间</span>
            </button>
          </div>

          <div class="form-panel" id="homeFormPanel" hidden>
            <div class="form-header">
              <h3 id="homeModeTitle">创建房间</h3>
              <button class="icon-btn back-btn" id="backMenuBtn">←</button>
            </div>

            <div class="input-group">
              <label class="holo-input">
                <span class="label-text">昵称</span>
                <input id="nicknameInput" maxlength="10" placeholder="输入你的代号" autocomplete="nickname" />
              </label>
            </div>

            <div class="form-fields" id="createFields">
              <label class="holo-input">
                <span class="label-text">房间密码（可选）</span>
                <input id="createPasswordInput" maxlength="18" placeholder="留空则无密码" autocomplete="new-password" />
              </label>
              <button class="holo-btn primary full-width" id="createRoomBtn">确认创建</button>
            </div>

            <div class="form-fields hidden" id="joinFields">
              <label class="holo-input">
                <span class="label-text">房号</span>
                <input id="joinCodeInput" maxlength="6" placeholder="6 位数字房号" inputmode="numeric" />
              </label>
              <label class="holo-input">
                <span class="label-text">房间密码</span>
                <input id="joinPasswordInput" maxlength="18" placeholder="无密码则留空" autocomplete="current-password" />
              </label>
              <button class="holo-btn secondary full-width" id="joinRoomBtn">确认加入</button>
            </div>
          </div>

          <div class="status-bar">
            <span class="status-dot" id="connectionStatus">正在连接...</span>
          </div>
          <div class="warning-text" id="serviceWarning"></div>
        </div>
      </section>

      <!-- 房间大厅 -->
      <section class="panel lobby-panel" id="lobbyPanel" hidden>
        <div class="lobby-header glass">
          <div class="room-info">
            <span class="room-label">ROOM</span>
            <strong id="lobbyRoomTitle">喝酒之弈</strong>
            <span class="room-code" id="lobbyRoomCode">------</span>
          </div>
          <div class="lobby-actions">
            <button class="icon-btn" id="copyRoomBtn" title="复制房号">📋</button>
            <button class="icon-btn danger" id="leaveRoomBtn" title="离开房间">✕</button>
          </div>
        </div>

        <div class="lobby-content">
          <div class="section-title">
            <h2>在线玩家</h2>
            <span class="count-badge" id="playerCount">0</span>
          </div>
          <div class="player-list" id="lobbyPlayers"></div>

          <div class="settings-panel glass">
            <div class="section-title">
              <h2>房间设置</h2>
            </div>
            <div class="settings-grid">
              <label class="holo-input">
                <span class="label-text">房间名</span>
                <input id="roomNameInput" maxlength="14" />
              </label>
              <label class="holo-input">
                <span class="label-text">密码</span>
                <input id="roomPasswordInput" maxlength="18" placeholder="留空表示无密码" />
              </label>
              <label class="checkbox-line">
                <input id="clearPasswordInput" type="checkbox" />
                <span>清除密码</span>
              </label>
              <label class="holo-input">
                <span class="label-text">初始手牌</span>
                <input id="initialHandInput" min="1" max="5" type="number" />
              </label>
              <label class="holo-input">
                <span class="label-text">手牌上限</span>
                <input id="handLimitInput" min="3" max="8" type="number" />
              </label>
              <label class="holo-input">
                <span class="label-text">初始血量（杯）</span>
                <input id="maxDrinksInput" min="1" max="10" type="number" />
              </label>
            </div>
            <div class="lobby-footer">
              <button class="holo-btn ghost" id="saveSettingsBtn">保存设置</button>
              <button class="holo-btn primary" id="startRoomGameBtn">开始游戏</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 游戏桌面 -->
      <section class="panel game-panel" id="gamePanel" hidden>
        <div class="game-top-bar">
          <div class="game-info">
            <span class="round-badge" id="roundStat">R1</span>
            <span class="deck-info">牌堆 <b id="deckStat">68</b></span>
            <span class="deck-info">弃牌 <b id="discardStat">0</b></span>
          </div>
          <div class="game-controls">
            <span id="turnPermissionHint">等待中...</span>
            <button class="icon-btn" id="backLobbyBtn">←</button>
          </div>
        </div>

        <div class="game-arena">
          <!-- 玩家血条区域 -->
          <div class="players-track" id="playerList"></div>

          <!-- 事件横幅 -->
          <div class="event-banner" id="turnBanner">
            <div class="banner-content">
              <p class="banner-label">当前回合</p>
              <h2 id="currentPlayerName">---</h2>
            </div>
            <div class="target-display">
              <span>目标：</span>
              <select id="targetSelect" aria-label="选择目标玩家"></select>
            </div>
          </div>

          <!-- 手牌区域 -->
          <div class="hand-area">
            <div class="hand-header">
              <h3 id="handTitle">手牌</h3>
              <span class="limit-tag" id="handLimitLabel">上限 5</span>
            </div>
            <div class="card-carousel" id="handCards">
              <div class="empty-state">等待发牌...</div>
            </div>
          </div>

          <!-- 持续效果 -->
          <div class="active-effects">
            <h4>已激活海克斯</h4>
            <div class="effects-scroll" id="activeList"></div>
          </div>
        </div>

        <!-- 底部操作栏 -->
        <div class="bottom-actions">
          <div class="action-row">
            <button class="holo-btn action" id="drawBtn">摸牌</button>
            <button class="holo-btn action accent" id="drinkDrawBtn">喝 1 补 1</button>
            <button class="holo-btn action primary" id="nextTurnBtn">下一位</button>
          </div>
          <div class="special-row">
            <button class="holo-btn mini" id="eventBtn">🎲 事件</button>
            <button class="holo-btn mini" id="ddBtn">DD 街区</button>
            <button class="holo-btn mini" id="shuffleDiscardBtn">洗牌</button>
            <button class="holo-btn mini" id="toggleLibraryBtn">卡库</button>
          </div>
        </div>

        <!-- 日志抽屉 -->
        <div class="log-drawer" id="logDrawer">
          <div class="log-header">
            <h3>酒局日志</h3>
            <button class="icon-btn" id="clearLogBtn">清空</button>
          </div>
          <div class="log-content" id="logList"></div>
        </div>
      </section>

      <!-- 卡库面板 -->
      <section class="panel library-panel" id="libraryPanel" hidden>
        <div class="library-header">
          <h2>完整卡库</h2>
          <button class="icon-btn close-lib" id="closeLibraryBtn">✕</button>
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">全部</button>
          <button class="filter-tab" data-filter="silver">银色</button>
          <button class="filter-tab" data-filter="gold">金色</button>
          <button class="filter-tab" data-filter="prismatic">彩色</button>
        </div>
        <div class="library-scroll" id="libraryGrid"></div>
      </section>
    </main>

    <!-- 倒计时遮罩 -->
    <div class="overlay countdown-overlay" id="countdownOverlay">
      <div class="overlay-content countdown">
        <h2>⚡ 插播阶段</h2>
        <div class="countdown-number" id="countdownTimer">5</div>
        <p id="countdownEventText"></p>
        <p class="hint">打出手牌影响结果！</p>
      </div>
    </div>

    <!-- 结算遮罩 -->
    <div class="overlay resolution-overlay" id="resolutionOverlay">
      <div class="overlay-content resolution">
        <h2>⚖️ 全息宣判</h2>
        <pre id="resolutionText"></pre>
      </div>
    </div>

    <!-- 海克斯选择遮罩 -->
    <div class="overlay hex-overlay" id="hexChoiceOverlay">
      <div class="overlay-content hex-choice">
        <h2>🔮 海克斯强化</h2>
        <p>三选一，选择你的被动效果</p>
        <div class="hex-choice-cards" id="hexChoiceCards"></div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
